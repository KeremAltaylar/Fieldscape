<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master FX mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The route's master FX (spec docs/superpowers/specs/2026-11-17-modulation-fx-design.md, B; Part 1 Task 10) - a mock for
   Kerem's approval before the panel is built (C-13). Frames (the pill at the bottom, or keys 1-7; ?clean hides the pill,
   ?t=<seconds> stops the clock there):
     #patch    the patch screen, Rhythm effects gone, Master FX in its column
     #echo     the FX editor (Open) on Echo          #cloud   the editor on Cloud, freeze lit, two rings
     #dry      everything dry                        #off     sound off: the scopes on a preview clock
     #novoice  no voice on                           #over    the load over budget
   Copy, ranges, defaults and readouts come from web/fx-model.js, so the mock and the build say the same things.
   The patch screen copies index.html + web/listener.css (the patch panel and its knobs). Tokens: Design System/Tokens.md. */
:root {
  --sunk: oklch(18% 0.012 162); --ground: oklch(24% 0.014 162); --panel: oklch(28% 0.015 162); --raised: oklch(33% 0.016 162);
  --hairline: oklch(36% 0.016 162);
  --ink: oklch(92.5% 0.006 150); --dim: oklch(78% 0.011 150); --faint: oklch(71% 0.013 150);
  --accent: oklch(83% 0.040 138); --lamp: oklch(88% 0.085 140);
  --bdr: color-mix(in oklch, var(--accent) 16%, transparent);
  --rel-1: oklch(80% 0.09 60); --rel-2: oklch(80% 0.08 230); --rel-3: oklch(82% 0.08 320);
  --rel-4: oklch(85% 0.06 140); --rel-5: oklch(84% 0.08 95); --rel-6: oklch(78% 0.08 285);
  /* modulation sources (Tokens.md, master FX 2026-11-17): the relation colours, one per source - instrument data (C-15) */
  --src-lfo1: var(--rel-2); --src-lfo2: var(--rel-3); --src-lfo3: var(--rel-5); --src-lfo4: var(--rel-6); --src-env: var(--rel-1); --src-chord: var(--rel-4);
  --font-display: "Cormorant Garamond", Georgia, serif; --font-body: "Newsreader", Georgia, serif; --font-mono: "Courier Prime", ui-monospace, monospace;
  --t-xs: 0.72rem; --t-sm: 0.78rem; --t-base: 1.0625rem; --t-md: 1.15rem; --t-lg: clamp(1.5rem, 2.4vw, 1.9rem);
  --track-meta: 0.18em; --track-eyebrow: 0.28em;
  --s-1: 0.25rem; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem;
  --d-fast: 180ms; --ease: cubic-bezier(0.77, 0, 0.18, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: var(--t-base); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

/* ---- the page's own controls (index.html) ---- */
button { font: inherit; font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--dim);
  background: var(--panel); border: 1px solid var(--bdr); border-radius: 2px; padding: var(--s-2) var(--s-3); cursor: pointer; }
button:hover { color: var(--ink); background: var(--raised); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
button.ghost { background: transparent; }
button[aria-pressed="true"] { color: var(--ink); background: color-mix(in oklch, var(--accent) 20%, transparent); border-color: color-mix(in oklch, var(--accent) 55%, transparent); }
button[aria-pressed="false"] { color: var(--faint); }
select { font: inherit; font-family: var(--font-body); font-size: var(--t-sm); color: var(--ink); background: var(--sunk); border: 1px solid var(--hairline); border-radius: 6px;
  padding: 1px 1.3rem 1px var(--s-2); -webkit-appearance: none; appearance: none; min-width: 0; width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 0.62rem center, right 0.4rem center; background-size: 4px 4px; background-repeat: no-repeat; cursor: pointer; }
select:hover { border-color: color-mix(in oklch, var(--accent) 40%, transparent); }

.viewerbar { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--hairline); background: var(--panel); }
.viewerbar .title { flex: 1; min-width: 0; font: 600 var(--t-md)/1.2 var(--font-display); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewerbar .title small { font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--faint); margin-left: var(--s-3); }
.viewerbar button { min-height: 44px; padding: 0 var(--s-3); border: 1px solid var(--hairline); border-radius: 10px; background: var(--raised); color: var(--ink);
  font-family: var(--font-body); font-size: var(--t-sm); letter-spacing: normal; text-transform: none; }
.viewerbar button.quiet { background: none; color: var(--dim); }
.viewerbar button:hover { border-color: color-mix(in oklch, var(--accent) 50%, var(--hairline)); }
.hdr-meter { display: inline-flex; align-items: center; gap: var(--s-1); margin-right: var(--s-2); font-family: var(--font-mono); font-size: var(--t-xs); color: var(--faint); }
.hdr-meter > i { font-style: normal; text-transform: uppercase; letter-spacing: 0.04em; }
.hdr-meter > b { position: relative; display: block; width: 7rem; height: 6px; background: var(--hairline); border-radius: 3px; overflow: hidden; }
.hdr-meter > b > b { display: block; height: 100%; width: 0; background: var(--accent); }
.hdr-meter > em { font-style: normal; min-width: 3.4em; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

.app { height: 100vh; display: flex; flex-direction: column; background: var(--ground); }
.body { flex: 1; min-height: 0; padding: var(--s-2) var(--s-4); display: flex; flex-direction: column; }

/* ---- the patch screen (index.html .ppcols / .pprow, listener.css knob rows) ---- */
.ppcols { display: grid; grid-template-columns: repeat(var(--ppcols, 5), minmax(0, 1fr)); gap: 0 var(--s-5); align-items: start; }
.ppcol { min-width: 0; position: relative; }
h2.eb { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-2) 0 var(--s-1); font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-eyebrow);
  text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; }
h2.eb:first-child { margin-top: 0; }
h2.eb::after { content: ""; flex: 1 1 auto; height: 1px; background: color-mix(in oklch, var(--ink) 10%, transparent); }
h2.eb span { overflow: hidden; text-overflow: ellipsis; }
.pprow { display: grid; grid-template-columns: minmax(0, 1fr) 24px 3.4rem; align-items: center; gap: var(--s-2); margin-bottom: 2px; min-height: 24px;
  font-size: var(--t-sm); color: var(--dim); }
.pprow > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pprow > i { font: 400 var(--t-xs) var(--font-mono); font-style: normal; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pprow.sel { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 3.4rem; }
.pprow.tog { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 3.4rem; }
.pprow button { padding: 1px var(--s-1); width: 100%; }
.pk { width: 24px; height: 24px; display: block; cursor: ns-resize; border-radius: 50%; }
.pk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pk svg { width: 100%; height: 100%; display: block; overflow: visible; }
.k-track { fill: none; stroke: var(--raised); stroke-linecap: round; }
.k-fill { fill: none; stroke: var(--accent); stroke-linecap: round; }
.k-tick { stroke: var(--ink); stroke-linecap: round; }
.pk:hover .k-fill, .pk:focus-visible .k-fill, .pk.on .k-fill { stroke: var(--lamp); }

/* Master FX in the column the rhythm effects left */
.mfx-col h2.eb { color: var(--dim); }
.chain { position: relative; display: flex; flex-direction: column; }
.chain::before { content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 1px; background: var(--hairline); }   /* the serial line */
.chain .pprow > span { display: flex; align-items: center; gap: var(--s-2); }
.lmp { flex: none; position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--faint); }
.lmp.lit { background: var(--lamp); box-shadow: 0 0 0 3px color-mix(in oklch, var(--lamp) 22%, transparent); }
.chain .pprow.off > span { color: var(--faint); }
.chain .pprow.off > i { color: var(--faint); }
.loadrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 3.4rem; align-items: center; gap: var(--s-2); min-height: 24px; font-size: var(--t-sm); color: var(--dim); }
.loadrow i { font: 400 var(--t-xs) var(--font-mono); font-style: normal; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--hairline); overflow: hidden; }
.bar > b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bar > s { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); text-decoration: none; }
.open { width: 100%; margin-top: var(--s-2); padding: var(--s-2); font-family: var(--font-body); font-size: var(--t-sm); letter-spacing: normal; text-transform: none; color: var(--ink);
  background: color-mix(in oklch, var(--accent) 14%, var(--panel)); border-color: color-mix(in oklch, var(--accent) 45%, transparent); border-radius: 6px; }
.open:hover { background: color-mix(in oklch, var(--accent) 26%, var(--panel)); }
.fxnote { margin: var(--s-1) 0 0; font-size: var(--t-xs); line-height: 1.4; color: var(--faint); }

.pphead { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin: var(--s-3) 0 var(--s-1); }
.pphead h2.eb { flex: 1; margin: 0; }
.pphead button { padding: 2px var(--s-2); }
.prog { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: var(--s-1); }
@media (max-width: 1399px) { .prog { grid-template-columns: repeat(8, minmax(0, 1fr)); } }   /* index.html 8a: one row of sixteen from 1400 px */
.ppchord { display: flex; flex-direction: column; gap: 1px; padding: 2px 3px; min-width: 0; background: var(--panel); border: 1px solid var(--bdr); border-radius: 2px; }
.ppchord .top { display: flex; align-items: baseline; gap: 3px; font: 400 var(--t-xs) var(--font-mono); color: var(--faint); }
.ppchord .top b { font-weight: 400; }
.ppchord .top em { font-style: normal; color: var(--ink); }
.ppchord .sw { height: 3px; border-radius: 2px; }
.ppchord .res { font: 400 var(--t-xs) var(--font-mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.morphs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s-1); }
.ppmorph { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 3px var(--s-1); align-items: center; padding: var(--s-1); background: var(--panel); border: 1px solid var(--bdr); border-radius: 2px; }
.ppmorph b { font: 400 var(--t-xs) var(--font-mono); color: var(--faint); }
.ppmorph button { padding: 1px var(--s-1); }
.ppmorph .res { grid-column: 1 / -1; font: 400 var(--t-xs) var(--font-mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ppmorph canvas { grid-column: 1 / -1; width: 100%; height: 22px; display: block; background: color-mix(in oklch, var(--sunk) 55%, transparent); border-radius: 2px; }

/* ---- the FX editor: a fixed 12-column grid (C-9), the displays take what the controls give back (C-10) ---- */
.ed { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--s-3);
  padding-bottom: var(--s-1); }
.strip { grid-column: span 12; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: var(--s-3); align-items: stretch; }
.mods { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 0; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; background: var(--sunk); }
.tile { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; gap: 2px var(--s-2); align-items: center;
  padding: var(--s-2) var(--s-3) var(--s-2); text-align: left; border: 0; border-right: 1px solid var(--hairline); border-radius: 0; background: transparent;
  font-family: var(--font-body); letter-spacing: normal; text-transform: none; color: var(--dim); min-width: 0; }
.tile:last-child { border-right: 0; }
.tile:not(:last-child)::after { content: ""; position: absolute; right: -4px; top: 50%; z-index: 1; width: 7px; height: 7px; margin-top: -4px; transform: rotate(45deg);
  border-top: 1px solid var(--faint); border-right: 1px solid var(--faint); background: var(--sunk); }   /* the chain runs left to right */
.tile .nm { font: 500 var(--t-md)/1 var(--font-display); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .mx { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); align-items: center; }
.tile .mx i { font: 400 var(--t-xs) var(--font-mono); font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; }
.tile .mx .bar { height: 3px; }
.tile .dots { position: absolute; top: var(--s-2); right: var(--s-2); display: flex; gap: 3px; }
.tile .dots u { width: 5px; height: 5px; border-radius: 50%; }
.tile:hover { background: var(--panel); color: var(--ink); }
.tile[aria-selected="true"] { background: var(--panel); box-shadow: inset 0 -2px 0 var(--accent); }
.tile.off .nm { color: var(--dim); }
.tile.off .mx i { color: var(--faint); }
.tile .lmp { grid-row: 1; }
.io { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; gap: 3px; width: 2.4rem; font: 400 var(--t-xs) var(--font-mono); color: var(--faint);
  text-transform: uppercase; letter-spacing: 0.04em; }
.io canvas { width: 14px; height: 100%; min-height: 0; display: block; border-radius: 2px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--hairline); }
.load { display: flex; flex-direction: column; justify-content: center; gap: var(--s-1); width: 11rem; padding: var(--s-2) var(--s-3); border: 1px solid var(--hairline); border-radius: 6px; background: var(--sunk); }
.load .lt { display: flex; justify-content: space-between; gap: var(--s-2); font: 400 var(--t-xs) var(--font-mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; }
.load .lt em { font-style: normal; color: var(--ink); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.load .bar { height: 5px; }
.load .lb { font-size: var(--t-xs); color: var(--faint); white-space: nowrap; }
.load.hot { border-color: color-mix(in oklch, var(--lamp) 60%, transparent); background: color-mix(in oklch, var(--lamp) 8%, var(--sunk)); }
.load.hot .bar > b { background: var(--lamp); }
.load.hot .lt em { color: var(--lamp); }

.notice { grid-column: span 12; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3); border: 1px solid var(--bdr); border-radius: 6px; background: var(--panel);
  font-size: var(--t-sm); color: var(--ink); }
.notice b { font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--dim); }
.notice span { flex: 1; min-width: 0; }
.notice button { padding: var(--s-1) var(--s-3); }
.notice.warn { border-color: color-mix(in oklch, var(--lamp) 55%, transparent); background: color-mix(in oklch, var(--lamp) 7%, var(--panel)); }
.notice.warn b { color: var(--lamp); }

.card { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3); background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; }
.left { grid-column: span 7; }
.right { grid-column: span 5; }
.module { grid-row: 2; }
.mhd { display: flex; align-items: baseline; gap: var(--s-3); min-width: 0; }
.mhd h3 { margin: 0; font: 400 var(--t-lg)/1 var(--font-display); }
.mhd p { flex: 1; min-width: 0; margin: 0; font-size: var(--t-sm); font-style: italic; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mhd .pos { font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.knobs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: var(--s-2); }
.kc { display: grid; justify-items: center; gap: 2px; min-width: 0; text-align: center; }
.kc .lbl { font-size: var(--t-sm); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.kc .val { font: 400 var(--t-xs) var(--font-mono); color: var(--ink); white-space: nowrap; text-align: center; font-variant-numeric: tabular-nums; }
.kc .live { font: 400 var(--t-xs) var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; min-height: 1.1em; }
.ek { width: 3.5rem; height: 3.5rem; cursor: ns-resize; border-radius: 50%; touch-action: none; }
.ek svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ek:focus-visible, .ek.focus { outline: 2px solid var(--lamp); outline-offset: 0; }
.ek:hover .k-fill, .ek.on .k-fill { stroke: var(--lamp); }
.ring { fill: none; stroke-linecap: round; stroke-width: 2.5; opacity: 0.5; }
.ringdot { stroke: var(--panel); stroke-width: 1.5; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; width: 100%; margin: 0.6rem 0 0.5rem; }
.seg button { border: 0; border-radius: 0; padding: var(--s-1) 2px; font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: 0; text-transform: none; color: var(--dim); background: var(--sunk); }
.seg button + button { border-left: 1px solid var(--hairline); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.seg.freeze button[aria-pressed="true"] { background: color-mix(in oklch, var(--lamp) 30%, var(--raised)); color: var(--ink); box-shadow: inset 0 0 0 1px var(--lamp); }
.disp { position: relative; flex: 1; min-height: 0; border: 1px solid var(--hairline); border-radius: 2px; background: color-mix(in oklch, var(--sunk) 70%, transparent); overflow: hidden; }
.disp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.disp .tag { position: absolute; top: var(--s-2); left: var(--s-2); font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-meta); text-transform: uppercase; color: var(--dim); }
.disp .tag.frz { left: auto; right: var(--s-2); color: var(--lamp); }
.empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: var(--s-2); text-align: center; padding: var(--s-4); background: color-mix(in oklch, var(--sunk) 82%, transparent); }
.empty p { margin: 0; max-width: 44ch; font: 400 var(--t-md)/1.35 var(--font-display); color: var(--ink); text-wrap: balance; }
.empty small { font-size: var(--t-sm); color: var(--dim); }

.mods-r { grid-row: 2; }
.ttl { display: flex; align-items: baseline; gap: var(--s-3); }
.ttl h4 { margin: 0; font: 400 var(--t-xs) var(--font-mono); letter-spacing: var(--track-eyebrow); text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.ttl small { flex: 1; min-width: 0; font-size: var(--t-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl .pv { font: 400 var(--t-xs) var(--font-mono); color: var(--sunk); background: var(--dim); border-radius: 2px; padding: 0 var(--s-1); white-space: nowrap; letter-spacing: 0.04em; }
.lfos { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.lfo { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: var(--s-1); padding: var(--s-2); background: var(--sunk); border: 1px solid var(--hairline); border-radius: 4px; }
.lfo .lh { display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-sm); color: var(--ink); min-width: 0; }
.lfo .lh u, .srcdot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.lfo .lh em { flex: 1; min-width: 0; text-align: right; font: 400 var(--t-xs) var(--font-mono); font-style: normal; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lfo .sc { position: relative; min-height: 0; }
.lfo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.shapes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--hairline); border-radius: 4px; overflow: hidden; }
.shapes button { padding: 3px 0; border: 0; border-radius: 0; background: transparent; display: grid; place-items: center; }
.shapes button + button { border-left: 1px solid var(--hairline); }

  function axis(g, W, H, ticks, lab) {

    var g = ctx2d(cv), W = g.W, H = g.H, top = 26, bot = H - 18, mid = (top + bot) / 2, L = function (k) { return denorm(BY[id + "." + k], liveX(fx, id + "." + k, t)); }, ac = C.accent, lp = C.lamp;

        if (rv) { g.fillStyle = C.dim; g.font = MONO; g.textAlign = "center"; g.textBaseline = "bottom"; g.fillText("◂", gx + gw / 2, mid - hh - 2); }
      }
      g.fillStyle = C.dim; g.font = MONO; g.textAlign = "right"; g.textBaseline = "top"; g.fillText(n + " grains · " + (pitch >= 0 ? "+" : "−") + Math.abs(pitch).toFixed(1) + " st", W - 8, top + 2);

      axis(g, W, H, [[16, "0 s"], [16 + (W - 32) / 2, (spn / 2).toFixed(spn < 10 ? 1 : 0) + " s"], [W - 16, spn.toFixed(spn < 10 ? 1 : 0) + " s"]]);
      g.beginPath(); g.moveTo(16, bot); for (var x3 = 0; x3 <= W - 32; x3 += 2) { var tt3 = x3 / (W - 32) * spn, e3 = Math.pow(10, -3 * tt3 / dec) * (0.7 + 0.3 * rnd(Math.floor(x3 * 1.3 + t * 30) )); g.lineTo(16 + x3, bot - e3 * (bot - top)); }
      g.lineTo(W - 16, bot); g.closePath(); g.fillStyle = alpha(ac, 0.3); g.fill(); g.strokeStyle = ac; g.lineWidth = 1; g.stroke();

      var resp = function (f) {
        if (id === "phase") { var c0 = L("hz") * Math.pow(2, L("span") * 0.5 * Math.sin(2 * Math.PI * t / M.divSeconds(M.get(fx, "phase.rate"), BPM))), st = M.get(fx, "phase.stages"), d = 1;
